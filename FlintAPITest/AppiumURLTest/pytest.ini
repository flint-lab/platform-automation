[pytest]
testpaths = .
timeout = 240
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s  %(levelname)-8s  %(message)s
log_cli_date_format = %H:%M:%S
log_level = INFO

markers =
    functional: correctness of allocation / URL shape / validation
    performance: time-to-ready / load (TC-002, TC-018)
    security: tenant isolation, guessability, invalidation, rate limiting
    reliability: expiry, races, GC, fault tolerance, soak
    scalability: concurrency caps, pool boundary, scale-out
    observability: metrics & tracing coverage (TC-030)
    destructive: breaks the server/host on purpose; runs ONLY with --env staging
