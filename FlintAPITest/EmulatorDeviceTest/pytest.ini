[pytest]
testpaths = .
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s  %(levelname)-8s  %(message)s
log_cli_date_format = %H:%M:%S
log_level = INFO

markers =
    e2e: end-to-end tests against a live FlintAPI environment
    slow: tests that involve large payloads or multiple recordings
